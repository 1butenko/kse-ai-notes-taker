[project]
name = "api"
version = "0.1.0"
description = "FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "boto3[crt]>=1.43.117",
    "deepagents>=0.7.28",
    "fastapi>=0.141.1",
    "fonttools>=4.68.0",
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "langchain>=1.4.6",
    "langchain-core>=1.6.12",
    "langchain-openrouter>=0.2.9",
    "langfuse>=5.2.0",
    "mammoth>=1.13.0",
    "markdownify>=1.2",
    "pillow>=12.0.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
