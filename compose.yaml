# Local development. `docker compose up --build`
#   web: http://localhost:3000
#   api: http://localhost:${API_PORT}  (docs at /docs), port set in .env
#   langfuse: http://localhost:3001  (traces of every model call)
include:
  - langfuse.compose.yaml

services:
  api:
    build:
      context: ./api
      target: dev
    ports:
      - "${API_PORT:-8000}:8000"
    env_file: .env
    environment:
      ENVIRONMENT: local
      # macOS bind mounts don't always deliver file events; poll so --reload is reliable.
      WATCHFILES_FORCE_POLLING: "true"
      CORS_ORIGINS: '["http://localhost:3000"]'
      UPLOADS_DIR: /data/uploads
      LANGFUSE_BASE_URL: http://langfuse-web:3000
      OTEL_SERVICE_NAME: kse-ai-notes-taker-api
    volumes:
      - ./api:/app
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./web
      target: dev
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:8000
      API_PORT: ${API_PORT:-8000}
    volumes:
      - ./web:/app
      # Keep the image's Linux node_modules and build cache instead of the host's.
      - /app/node_modules
      - /app/.next
    depends_on:
      api:
        condition: service_healthy

volumes:
  uploads:
