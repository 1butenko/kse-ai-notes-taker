# Lint, test and build the api and web on every PR and on main.
# Same checks as `make lint` and `make test`, plus a type check and a production build of the web.
# Runs on GitHub's Linux runners; nothing is deployed.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (ruff, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      # Python version comes from api/.python-version.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      # Live tests (LIVE=1) are skipped: they need real model keys.
      - name: Pytest
        run: uv run pytest -q

  web:
    name: Web (eslint, tsc, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      # Same major version as web/Dockerfile.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      # typegen writes the route types (PageProps, LayoutProps, RouteContext) into .next/types.
      - name: Type check
        run: npx next typegen && npx tsc --noEmit

      - name: Build
        run: npm run build
