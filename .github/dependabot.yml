# Dependabot version updates. Security updates are on in the repository settings
# and open PRs as soon as an advisory affects a dependency, regardless of this schedule.
version: 2
updates:
  - package-ecosystem: uv
    directory: /api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      api-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(api)"

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Types must match the Node runtime in web/Dockerfile (node:24), not the latest Node.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(web)"

  - package-ecosystem: docker
    directories: [/api, /web]
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps(docker)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "deps(actions)"
